<text x="42" y="584" font-size="17" font-weight="bold" fill="#0e7490" text-anchor="start">PERCEPTION (OpenCV 5)</text>
<text x="42" y="606" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">photo 6ac34afa4c3227d11cfbd154.jpg, 768 x 432</text>
<text x="42" y="625" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">op 5 YOLO26n: 0 flies, DNN 172.5 ms (laptop)</text>
<text x="42" y="644" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">op 2: issues [&#x27;glare&#x27;] → flag [&#x27;overexposed&#x27;], score 78.25</text>
<text x="42" y="663" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">   glare share 0.021, clipped highs 0.014, sharpness 264.3</text>
<text x="42" y="682" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">op 1: lure floor found, covers 0.6861 of the frame</text>
<text x="42" y="701" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">ops 3-4: registered (36 SIFT inliers), new 0, gone 0</text>
<text x="42" y="720" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">op 8: person suspected False</text>
<rect x="488" y="547" width="114" height="22" rx="11" fill="#a16207"/>
<text x="545" y="562" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">OPENCV 5 NEW</text>
<rect x="630" y="558" width="580" height="179" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="642" y="584" font-size="17" font-weight="bold" fill="#6d28d9" text-anchor="start">DECISION (agent)</text>
<text x="642" y="606" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">planner: rule, fallback false, LLM calls 0</text>
<text x="642" y="625" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">1 quality.recapture → capture</text>
<text x="642" y="644" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">   &quot;[&#x27;glare&#x27;]: capture again&quot;</text>
<text x="642" y="663" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">2 quality.awaiting_photo → wait</text>
<text x="642" y="682" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">   the new photo arrives as a new event</text>
<text x="642" y="701" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">event: photo_not_counted, why [&#x27;glare&#x27;]</text>
<text x="642" y="720" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">outcome: quality.recapture, quality.awaiting_photo</text>
<rect x="1144" y="547" width="58" height="22" rx="11" fill="#6d28d9"/>
<text x="1173" y="562" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AGENT</text>
<rect x="1230" y="558" width="660" height="179" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1242" y="584" font-size="17" font-weight="bold" fill="#c2410c" text-anchor="start">ACTION (guarded tool calls)</text>
<text x="1242" y="606" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">tool 0 analyze_trap_photo: ok, INGESTED → ANALYZED, 1120.6 ms</text>
<text x="1242" y="625" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">tool 1 capture(recapture, main): ok,</text>
<text x="1242" y="644" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">   DECIDED → ACTED, transport flybot_proposal</text>
<text x="1242" y="663" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">proposal capture_now: confidence 0.9, requiresApproval false</text>
<text x="1242" y="682" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">FlyBot: a confirm card + Telegram; Confirm runs the</text>
<text x="1242" y="701" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">EZVIZ capture → a new photo → this loop again</text>
<text x="1242" y="720" font-size="15" font-weight="normal" fill="#0f172a" text-anchor="start">total 1134.8 ms on the laptop (Lambda warm p50 1,091 ms)</text>
<rect x="1752" y="547" width="130" height="22" rx="11" fill="#c2410c"/>
<text x="1817" y="562" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">HUMAN APPROVAL</text>
<text x="30" y="782" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Not measured: whether these glare flags are right (no human look) and the confirm-to-new-photo time on AWS. The replay cannot take photos: the 07:17-07:35 photos are the camera&#x27;s own.</text>
<text x="30" y="806" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Lambda warm p50: bench/results/lambda_latency.json. Small specks on the lid are missed by YOLO26n (models/MODEL_CARD.md), so FlyBot&#x27;s production count is higher here.</text>
