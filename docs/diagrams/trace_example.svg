<text x="30" y="532" font-size="15" font-weight="normal" fill="#475569" text-anchor="start">Orange rows: op 2 sees glare, so the planner asks for a new photo; the same camera minutes earlier and later gets no_op. FlyBot&#x27;s count is its production model&#x27;s, not a human count.</text>
